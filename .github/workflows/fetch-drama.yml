# 海盐葡萄 · 每天抓取豆瓣热播剧集
name: 抓取剧集数据

on:
  schedule:
    # 每天 3 次（UTC 2/10/18 = 北京 10/18/02 点）
    - cron: '0 2,10,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-drama:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取剧集数据
        run: python scripts/fetch_drama.py

      - name: 提交 drama.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drama.json
          if git diff --cached --quiet; then
            echo "无更新"
          else
            git commit -m "🎬 更新剧集数据 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
